
name: Check TryHackMe Public Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  inspect-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect public profile HTML
        run: |
          python -m pip install requests beautifulsoup4
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup

          url = "https://tryhackme.com/p/sohan34"
          response = requests.get(
              url,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=30,
          )

          print("HTTP status:", response.status_code)
          print("Final URL:", response.url)
          print("Content type:",
                response.headers.get("content-type"))
          response.raise_for_status()

          soup = BeautifulSoup(response.text, "html.parser")
          print("Page title:",
                soup.title.get_text(" ", strip=True)
                if soup.title else "(no title)")

          text = " ".join(soup.stripped_strings)
          for keyword in [
              "rank", "level", "room", "completed",
              "solved", "points", "sohan34"
          ]:
              start = 0
              found = False
              while True:
                  index = text.lower().find(keyword, start)
                  if index < 0:
                      break
                  print(f"\n[{keyword}]",
                        text[max(0, index - 100):index + 220])
                  found = True
                  start = index + len(keyword)
                  if start and text.lower().count(keyword) > 3:
                      break
              if not found:
                  print(f"\n[{keyword}] Not found in page text")

          print("\nHTML length:", len(response.text))
          PY
