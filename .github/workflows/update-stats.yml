
name: Update LeetCode Stats

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update LeetCode stats
        env:
          LEETCODE_USERNAME: sohan34
        run: python scripts/update_stats.py

      - name: Commit changes if stats changed
        run: |
          if ! git diff --quiet -- stats.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stats.json
            git commit -m "Update LeetCode stats"
            git push
          else
            echo "Stats unchanged; no commit needed."
          fi
