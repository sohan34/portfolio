
name: Check TryHackMe Public Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  inspect-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect public profile HTML
        run: |
          python -m pip install requests beautifulsoup4
          python - <<'PY'
          
          import json
          import os
          import requests
          from bs4 import BeautifulSoup
          
          # Use the HTML captured from the public profile.
          # The live request may still return HTTP 429.
          url = "https://tryhackme.com/p/sohan34"
          
          response = requests.get(
              url,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=30,
          )
          response.raise_for_status()
          
          soup = BeautifulSoup(response.text, "html.parser")
          
          def get_stat(label):
              for box in soup.select('[class*="StyledStatisticBox"]'):
                  label_el = box.select_one(
                      '[class*="StyledStatisticsBoxText"]'
                  )
                  value_el = box.select_one(
                      '[class*="StyledStatisticsBoxNumber"]'
                  )
          
                  if (
                      label_el
                      and value_el
                      and label_el.get_text(" ", strip=True).lower()
                          == label.lower()
                  ):
                      return value_el.get_text(" ", strip=True)
          
              return None
          
          stats = {
              "rank": get_stat("Rank"),
              "completed_rooms": get_stat("Completed rooms"),
              "level": get_stat("Level"),
          }
          
          print("Extracted stats:", stats)
          
          os.makedirs("public", exist_ok=True)
          with open("public/thm-stats.json", "w") as f:
              json.dump(stats, f, indent=2)

          PY
